<!DOCTYPE html>
<html>
<head>
<title>A-Frame Modern Decorated Dining Room - Flower Edition</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<a-scene>

<!-- Camera -->
<a-camera position="0 1.6 6"></a-camera>

<!-- FLOOR -->
<a-plane rotation="-90 0 0" width="12" height="12" color="#5c4033"></a-plane>

<!-- CEILING (Base) -->
<a-plane position="0 5 0" rotation="90 0 0" width="12" height="12" color="#f5f5f5"></a-plane>

<!-- ================= -->
<!-- CEILING DECORATIONS -->
<!-- ================= -->
<!-- Wooden Beams -->
<a-box position="0 4.9 -4" width="12" height="0.2" depth="0.3" color="#3b2b1a"></a-box>
<a-box position="0 4.9 -2" width="12" height="0.2" depth="0.3" color="#3b2b1a"></a-box>
<a-box position="0 4.9 0" width="12" height="0.2" depth="0.3" color="#3b2b1a"></a-box>
<a-box position="0 4.9 2" width="12" height="0.2" depth="0.3" color="#3b2b1a"></a-box>
<a-box position="0 4.9 4" width="12" height="0.2" depth="0.3" color="#3b2b1a"></a-box>

<!-- Chandelier -->
<a-entity position="0 5 0">
    <a-cylinder position="-0.5 -0.75 0" radius="0.01" height="1.5" color="#111"></a-cylinder>
    <a-cylinder position="0.5 -0.75 0" radius="0.01" height="1.5" color="#111"></a-cylinder>
    <a-box position="0 -1.5 0" width="1.8" height="0.05" depth="0.1" color="#111"></a-box>
    <a-sphere position="-0.7 -1.6 0" radius="0.12" color="#fff9e6"></a-sphere>
    <a-sphere position="-0.25 -1.6 0" radius="0.12" color="#fff9e6"></a-sphere>
    <a-sphere position="0.25 -1.6 0" radius="0.12" color="#fff9e6"></a-sphere>
    <a-sphere position="0.7 -1.6 0" radius="0.12" color="#fff9e6"></a-sphere>
</a-entity>

<!-- ================= -->
<!-- WALLS & ARCHITECTURAL TRIM -->
<!-- ================= -->
<a-plane position="0 2.5 -6" width="12" height="5" color="#e6e6fa"></a-plane>
<a-plane position="-6 2.5 0" rotation="0 90 0" width="12" height="5" color="#e6e6fa"></a-plane>
<a-plane position="6 2.5 0" rotation="0 -90 0" width="12" height="5" color="#e6e6fa"></a-plane>

<!-- Baseboards -->
<a-box position="0 0.1 -5.95" width="12" height="0.2" depth="0.05" color="#333"></a-box>

<!-- ================= -->
<!-- WINDOW & HANGING VINES -->
<!-- ================= -->
<a-entity position="-5.96 2.5 0" rotation="0 90 0">
    <a-plane width="4" height="2.5" color="#87ceeb"></a-plane>
    <!-- Frame -->
    <a-box width="4.2" height="0.1" depth="0.1" position="0 1.25 0.01" color="#222"></a-box>
    <!-- Hanging Vines (No Models) -->
    <a-sphere position="-1.5 1.1 0.1" radius="0.15" color="#2d5a27"></a-sphere>
    <a-sphere position="-1.5 0.9 0.15" radius="0.1" color="#3d7a34"></a-sphere>
    <a-sphere position="-1.5 0.75 0.12" radius="0.08" color="#2d5a27"></a-sphere>
</a-entity>

<!-- ================= -->
<!-- TABLE & CENTERPIECE FLOWERS -->
<!-- ================= -->
<a-entity position="0 0 0">
    <a-box position="0 0.9 0" depth="2.2" height="0.05" width="2.2" color="#222"></a-box>
    <a-cylinder position="1 0.45 1" radius="0.03" height="0.9" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-1 0.45 1" radius="0.03" height="0.9" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="1 0.45 -1" radius="0.03" height="0.9" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-1 0.45 -1" radius="0.03" height="0.9" color="#bdc3c7"></a-cylinder>

    <!-- REQUIRED ITEMS -->
    <a-entity position="-0.4 0.925 0">
        <a-cylinder position="0 0.225 0" radius="0.15" height="0.45" color="green"></a-cylinder>
        <a-text value="MILO" position="0 0.225 0.16" align="center" width="1.5" color="yellow"></a-text>
    </a-entity>
    <a-entity position="0.4 0.925 0">
        <a-cylinder position="0 0.175 0" radius="0.15" height="0.35" color="white"></a-cylinder>
        <a-text value="MILK" position="0 0.175 0.16" align="center" width="1.5" color="blue"></a-text>
    </a-entity>
    <a-entity position="-0.3 1.05 0.7">
        <a-cylinder radius="0.1" height="0.25" color="yellow"></a-cylinder>
        <a-torus radius="0.06" radius-tubular="0.01" arc="180" rotation="0 0 -90" position="0.1 0 0" color="yellow"></a-torus>
    </a-entity>
    <a-entity position="0.3 1.05 0.7">
        <a-cylinder radius="0.1" height="0.25" color="yellow"></a-cylinder>
        <a-torus radius="0.06" radius-tubular="0.01" arc="180" rotation="0 0 -90" position="0.1 0 0" color="yellow"></a-torus>
    </a-entity>

    <!-- NEW: TABLE FLOWER CENTERPIECE -->
    <a-entity position="0 0.93 -0.3">
        <a-cylinder radius="0.1" height="0.3" color="lightblue" opacity="0.6"></a-cylinder> <!-- Vase -->
        <a-cylinder radius="0.005" height="0.4" position="0 0.2 0" color="green"></a-cylinder> <!-- Stem -->
        <a-sphere position="0 0.4 0" radius="0.08" color="pink"></a-sphere> <!-- Flower -->
        <a-sphere position="0.08 0.38 0.05" radius="0.07" color="red"></a-sphere> <!-- Flower -->
        <a-sphere position="-0.08 0.38 -0.05" radius="0.07" color="pink"></a-sphere> <!-- Flower -->
    </a-entity>
</a-entity>

<!-- CHAIRS -->
<a-entity position="-1.6 0 0" rotation="0 90 0">
    <a-box position="0 0.5 0" depth="0.7" height="0.08" width="0.7" color="#333"></a-box>
    <a-box position="0 0.9 -0.32" rotation="-10 0 0" depth="0.06" height="0.8" width="0.7" color="#333"></a-box>
    <a-cylinder position="0.25 0.25 0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-0.25 0.25 0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="0.25 0.25 -0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-0.25 0.25 -0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
</a-entity>

<a-entity position="1.6 0 0" rotation="0 -90 0">
    <a-box position="0 0.5 0" depth="0.7" height="0.08" width="0.7" color="#333"></a-box>
    <a-box position="0 0.9 -0.32" rotation="-10 0 0" depth="0.06" height="0.8" width="0.7" color="#333"></a-box>
    <a-cylinder position="0.25 0.25 0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-0.25 0.25 0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="0.25 0.25 -0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
    <a-cylinder position="-0.25 0.25 -0.25" radius="0.02" height="0.5" color="#bdc3c7"></a-cylinder>
</a-entity>

<!-- TV -->
<a-entity position="5.9 2.5 0" rotation="0 -90 0">
    <a-box width="3.5" height="2" depth="0.1" color="black"></a-box>
    <a-plane width="3.3" height="1.8" position="0 0 0.06" color="#111"></a-plane>
</a-entity>

<!-- ================= -->
<!-- BACK WALL & SIDEBOARD FLOWERS -->
<!-- ================= -->
<!-- Sideboard Cabinet -->
<a-box position="0 0.6 -5.6" width="4" height="1.2" depth="0.7" color="#2c3e50"></a-box>
<!-- Tall Vase on Sideboard -->
<a-entity position="-1 1.2 -5.5">
    <a-cylinder radius="0.1" height="0.5" color="white"></a-cylinder>
    <a-sphere position="0 0.3 0" radius="0.1" color="yellow"></a-sphere>
    <a-sphere position="0.1 0.4 0" radius="0.08" color="white"></a-sphere>
</a-entity>

<!-- Shelf Flowers -->
<a-entity position="3.5 2.5 -5.85">
    <a-box width="2" height="0.05" depth="0.4" color="#333"></a-box>
    <a-cylinder position="0.6 0.15 0" radius="0.1" height="0.2" color="brown"></a-cylinder> <!-- Pot -->
    <a-sphere position="0.6 0.3 0" radius="0.1" color="purple"></a-sphere> <!-- Flower -->
</a-entity>

<!-- FRIDGE -->
<a-entity position="-4.5 0 4.5">
    <a-box position="0 1.25 0" width="1.2" height="2.5" depth="1" color="#C0C0C0"></a-box>
</a-entity>

<!-- Corner Plant -->
<a-entity position="5 0 -5">
    <a-cylinder radius="0.3" height="0.8" color="#333"></a-cylinder>
    <a-sphere position="0 0.8 0" radius="0.5" color="#1b5e20"></a-sphere>
</a-entity>

<a-sky color="#ececec"></a-sky>

</a-scene>

</body>
</html>
